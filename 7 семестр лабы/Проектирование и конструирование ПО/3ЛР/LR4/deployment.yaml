apiVersion: apps/v1
kind: Deployment
metadata:
  name: lr4-main-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lr4-main
  template:
    metadata:
      labels:
        app: lr4-main
    spec:
      containers:
      - name: lr4-main
        image: lr4-main:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7283
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lr4-clients-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lr4-clients
  template:
    metadata:
      labels:
        app: lr4-clients
    spec:
      containers:
      - name: lr4-clients
        image: lr4-clients:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7232
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: lr4-main-service
  labels:                    
    app: lr4-main
spec:
  selector:
    app: lr4-main
  ports:
  - name: http-metrics       
    port: 80
    targetPort: 7283
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: lr4-clients-service
  labels:                    
    app: lr4-clients
spec:
  selector:
    app: lr4-clients
  ports:
  - name: http-metrics       
    port: 80
    targetPort: 7232
  type: ClusterIP